services:
  postgres_db:
    image: postgres:16-alpine
    container_name: multilingo-postgres
    ports:
      - "${HOST_DB_PORT:-5434}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-multilingodb}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-multilingodb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - multilingo-net

  redis_cache:
    image: redis:7-alpine
    container_name: multilingo-redis
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - multilingo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multilingo-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/${DB_NAME:-multilingodb}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_DATA_REDIS_HOST=redis_cache
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - multilingo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multilingo-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - multilingo-net

volumes:
  postgres_data:

networks:
  multilingo-net:
    driver: bridge
