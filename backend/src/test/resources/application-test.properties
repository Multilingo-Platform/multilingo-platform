spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.type.json_format_mapper=jackson
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.flyway.enabled=false

# Gemini AI Configuration (Disabled in test profile)
testing.gemini.enabled=false

# Writing Hints Configuration (Disabled in test profile)
testing.writing-hints.enabled=false

# Never fetch external images in the test profile.
testing.image-fetch.enabled=false

# Writing Grading Configuration (Disabled in test profile)
testing.writing-grading.enabled=false
testing.writing-grading.images-enabled=false
testing.writing-grading.dispatcher-enabled=false

# Default Exam Dataset (Disabled in test profile)
exam.default-dataset.enabled=false
exam.default-dataset.publish-approved=false

# Practice Dictionary Lookup (Disabled in test profile)
testing.dictionary-lookup.enabled=false
