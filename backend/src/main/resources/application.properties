spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8088}

# Database configuration (hỗ trợ cả biến môi trường Docker và Local Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:multilingodb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.json_format_mapper=jackson

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true

# Redis configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

# JWT Configuration
app.jwt.secret=${SPRING_JWT_SECRET:DayLaMotSecretKeyRatDaiVaPhucTapDungDeKiJWTVaGiaiMa2026!}
app.jwt.expiration-ms=${SPRING_JWT_EXPIRATION_MS:1800000}
app.jwt.refresh-expiration-ms=${SPRING_JWT_REFRESH_EXPIRATION_MS:604800000}

# VNPay Configuration
vnpay.tmnCode=${VNPAY_TMN_CODE:TEST_TMN}
vnpay.hashSecret=${VNPAY_HASH_SECRET:TEST_SECRET}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:5173/student/payment/result

# Terminal & Logging Configuration
spring.output.ansi.enabled=ALWAYS
logging.charset.console=UTF-8

# Gemini AI Configuration
testing.gemini.enabled=${GEMINI_ENABLED:false}
testing.gemini.api-key=${GEMINI_API_KEY:}
testing.gemini.model=${GEMINI_MODEL:}
testing.gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:5s}
testing.gemini.request-timeout=${GEMINI_REQUEST_TIMEOUT:30s}
