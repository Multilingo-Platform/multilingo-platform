spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8088}

# Database configuration (hỗ trợ cả biến môi trường Docker và Local Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:multilingodb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.json_format_mapper=jackson

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true

# Redis configuration (hỗ trợ cả Local Docker và Cloud Upstash TLS)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=5000ms

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}

# JWT Configuration
app.jwt.secret=${SPRING_JWT_SECRET:DayLaMotSecretKeyRatDaiVaPhucTapDungDeKiJWTVaGiaiMa2026!}
app.jwt.expiration-ms=${SPRING_JWT_EXPIRATION_MS:1800000}
app.jwt.refresh-expiration-ms=${SPRING_JWT_REFRESH_EXPIRATION_MS:604800000}

# Google OAuth Configuration
app.google.client-id=${GOOGLE_CLIENT_ID:}

# VNPay Configuration
vnpay.tmnCode=${VNPAY_TMN_CODE:TEST_TMN}
vnpay.hashSecret=${VNPAY_HASH_SECRET:TEST_SECRET}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:5173/student/payment/result}

# Terminal & Logging Configuration
spring.output.ansi.enabled=ALWAYS
logging.charset.console=UTF-8

# Gemini AI Configuration
testing.gemini.enabled=${GEMINI_ENABLED:true}
testing.gemini.api-key=${GEMINI_API_KEY:}
testing.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
testing.gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:15s}
testing.gemini.request-timeout=${GEMINI_REQUEST_TIMEOUT:60s}

# Writing Hints Configuration
testing.writing-hints.enabled=${WRITING_HINTS_ENABLED:true}
testing.writing-hints.min-interval=${WRITING_HINTS_MIN_INTERVAL:10s}
testing.writing-hints.lease-extension=${WRITING_HINTS_LEASE_EXTENSION:15s}
testing.writing-hints.supported-languages=${WRITING_HINTS_SUPPORTED_LANGUAGES:en,vi,ko,zh,ja,fr,de,es}
testing.languages.supported=${TESTING_SUPPORTED_LANGUAGES:${WRITING_HINTS_SUPPORTED_LANGUAGES:en,vi,ko,zh,ja,fr,de,es}}

# Practice AI dictionary is opt-in; the recovery worker starts only when enabled.
testing.dictionary-lookup.enabled=${DICTIONARY_LOOKUP_ENABLED:true}
testing.dictionary-lookup.recovery-interval-ms=${DICTIONARY_LOOKUP_RECOVERY_INTERVAL_MS:60000}
# Default exams are opt-in; only approved, versioned classpath bundles may be seeded.
exam.default-dataset.enabled=${EXAM_DEFAULT_DATASET_ENABLED:false}
exam.default-dataset.publish-approved=${EXAM_DEFAULT_DATASET_PUBLISH_APPROVED:false}
exam.default-dataset.keys=${EXAM_DEFAULT_DATASET_KEYS:cambridge-ielts-20-test-1,ets-2024-test-1}
# The development mock is separately opt-in and never runs alongside the official seed.
exam.mock-data.enabled=${EXAM_MOCK_DATA_ENABLED:false}

# Image fetching is independent from Gemini and closed by default.
testing.image-fetch.enabled=${IMAGE_FETCH_ENABLED:true}
testing.image-fetch.allowed-url-prefixes=${IMAGE_FETCH_ALLOWED_URL_PREFIXES:https://res.cloudinary.com/}
testing.image-fetch.connect-timeout=${IMAGE_FETCH_CONNECT_TIMEOUT:5s}
testing.image-fetch.request-timeout=${IMAGE_FETCH_REQUEST_TIMEOUT:15s}

# Writing Grading Configuration
testing.writing-grading.enabled=${WRITING_GRADING_ENABLED:true}
testing.writing-grading.multilingual-enabled=${WRITING_GRADING_MULTILINGUAL_ENABLED:false}
testing.writing-grading.images-enabled=${WRITING_GRADING_IMAGES_ENABLED:true}
testing.writing-grading.poll-interval=${WRITING_GRADING_POLL_INTERVAL:5s}
testing.writing-grading.batch-size=${WRITING_GRADING_BATCH_SIZE:10}
testing.writing-grading.concurrency=${WRITING_GRADING_CONCURRENCY:2}
testing.writing-grading.quota-recheck-interval=${WRITING_GRADING_QUOTA_RECHECK_INTERVAL:60s}
testing.writing-grading.lease-extension=${WRITING_GRADING_LEASE_EXTENSION:30s}
testing.writing-grading.dispatcher-enabled=${WRITING_GRADING_DISPATCHER_ENABLED:true}

# Brevo Email Configuration
brevo.api-key=${BREVO_API_KEY:}
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.sender.email=${BREVO_SENDER_EMAIL:no-reply@multilingo.com}
brevo.sender.name=${BREVO_SENDER_NAME:Multilingo Platform}
