name: Multilingo CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch: # Cho phép kích hoạt thủ công khi cần

jobs:
  # -----------------------------------------------------------
  # 1. CI BACKEND (Chạy độc lập song song)
  # -----------------------------------------------------------
  backend-ci:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests (H2 in-memory)
        working-directory: ./backend
        run: mvn clean test

  # -----------------------------------------------------------
  # 2. CI FRONTEND (Chạy độc lập song song)
  # -----------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check Lint (Oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  # -----------------------------------------------------------
  # 3. CD DEPLOY (Chỉ chạy khi push vào nhánh main & cả 2 CI PASS)
  # -----------------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/multilingo-platform
            git pull origin main
            docker compose down
            docker compose up -d --build
